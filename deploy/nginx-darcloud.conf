# Nginx Configuration for DarCloud FungiMesh Server
# ================================================

upstream mesh_backend {
    server localhost:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name mesh.darcloud.host;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mesh.darcloud.host;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mesh.darcloud.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mesh.darcloud.host/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # API endpoints
    location / {
        proxy_pass http://mesh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://mesh_backend;
        access_log off;
    }

    # Static files
    location /static/ {
        alias /var/www/darcloud/quranchain-mesh/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Additional server blocks for other subdomains can be added here
