################################################################################
# Nginx Configuration for QuranChain-OS
# Reverse proxy with SSL/TLS termination
# Provides unified entry point for all microservices
################################################################################

upstream quranchain_app {
    least_conn;
    server localhost:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream quranchain_blockchain {
    least_conn;
    server localhost:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream quranchain_gaming {
    least_conn;
    server localhost:7002 max_fails=3 fail_timeout=30s;
    server localhost:7003 max_fails=3 fail_timeout=30s;
    server localhost:7004 max_fails=3 fail_timeout=30s;
    server localhost:7005 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=gaming_limit:10m rate=50r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Health check endpoint (allow unencrypted for monitoring)
    location /health {
        proxy_pass http://quranchain_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name darcloud.host mesh.darcloud.host blockchain.darcloud.host api.darcloud.host *.darcloud.host;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/darcloud.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darcloud.host/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/darcloud.host/chain.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/quranchain-access.log combined buffer=32k flush=5m;
    error_log /var/log/nginx/quranchain-error.log warn;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml;
    
    # Root location - proxy to main app
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://quranchain_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
    
    # Health check endpoint
    location = /health {
        access_log off;
        proxy_pass http://quranchain_app;
        proxy_set_header Host $host;
    }
    
    # Blockchain API
    location /blockchain/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://quranchain_blockchain/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Blockchain health
    location = /blockchain/health {
        access_log off;
        proxy_pass http://quranchain_blockchain/health;
        proxy_set_header Host $host;
    }
    
    # Gaming API
    location /gaming/ {
        limit_req zone=gaming_limit burst=50 nodelay;
        proxy_pass http://quranchain_gaming/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Webhook endpoint - higher rate limit
    location = /webhook/stripe {
        limit_req zone=webhook_limit burst=100 nodelay;
        proxy_pass http://quranchain_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# API subdomain
