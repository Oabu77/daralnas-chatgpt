[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==================================================================================
# QuranChain™ Continuous Monitoring Dashboard
# ==================================================================================

[program:quranchain_monitoring_daemon]
command=python3 /home/omar/Desktop/QuranChain/monitoring_daemon.py
directory=/home/omar/Desktop/QuranChain
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
priority=999

# Logging
stderr_logfile=/home/omar/Desktop/QuranChain/monitoring_logs/daemon_error.log
stdout_logfile=/home/omar/Desktop/QuranChain/monitoring_logs/daemon_output.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile_backups=3

# Environment
environment=PATH="/usr/local/bin:/usr/bin:/bin"

# Process management
stopwaitsecs=10
numprocs=1
process_name=monitoring_daemon_%(process_num)d

# Restart policy
[eventlistener:quranchain_monitoring_watchdog]
command=python3 -c "
import sys
from supervisor import events
from supervisor.process import ProcessStates

def handle_event(msg):
    if isinstance(msg, events.ProcessStateEvent):
        if msg.process_name == 'quranchain_monitoring_daemon' and msg.process_state == ProcessStates.FATAL:
            print(f'ALERT: Monitoring daemon crashed - attempting restart')

while True:
    headers, body = sys.stdin.readline(), sys.stdin.readline()
    msg = events.deserialize_header_and_payload(headers, body)
    handle_event(msg)
"
buffer_size=100
events=PROCESS_STATE
startsecs=0

---

# Note: To use this configuration with supervisord:
#
# 1. Copy this file to supervisord config directory:
#    sudo cp monitoring_supervisord.conf /etc/supervisor/conf.d/
#
# 2. Update supervisord:
#    sudo supervisorctl reread
#    sudo supervisorctl update
#
# 3. Check status:
#    sudo supervisorctl status quranchain_monitoring_daemon
#
# 4. View logs:
#    tail -f /home/omar/Desktop/QuranChain/monitoring_logs/daemon_output.log
#    tail -f /home/omar/Desktop/QuranChain/monitoring_logs/daemon_error.log
