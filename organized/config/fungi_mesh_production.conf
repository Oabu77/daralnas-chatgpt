[program:fungi_mesh_production]
# Fungi Mesh Production Service - Auto-restart on crash
command=/usr/bin/python3 /home/omar/Desktop/QuranChain/fungi_mesh_production.py
directory=/home/omar/Desktop/QuranChain
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
priority=999
redirect_stderr=true
stdout_logfile=/home/omar/Desktop/QuranChain/monitoring_logs/fungi_mesh_supervisor.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=5
user=omar
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Restart policy: if it crashes, restart after 5 seconds
startsecs=5
stopwaitsecs=10
startretries=3
retry=3

# Resource limits
numprocs=1
process_name=fungi_mesh_%(process_num)d
