name: Stripe Issuing Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'src/routes/cards.js'
      - 'src/middleware/auth.js'
      - '__tests__/cardAuthorizationSecurity.test.js'
      - '.github/workflows/stripe-issuing-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider-isolated Issuing authorization regression
        run: npx jest __tests__/cardAuthorizationSecurity.test.js --runInBand
