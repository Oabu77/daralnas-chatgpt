name: deploy-mcp-sample
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace (must NOT be default)"
        required: true
        default: "mcp-tasks"
permissions:
  contents: read
  packages: write
  id-token: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safety check (namespace)
        run: |
          NS="${{ github.event.inputs.namespace }}"
          if [ "$NS" = "default" ] || [ -z "$NS" ]; then
            echo "Refusing to deploy to '$NS'"; exit 1; fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mcp-tasks
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Write kubeconfig
        run: echo "${KUBE_CONFIG_BASE64}" | base64 -d > $HOME/.kube/config
        env: { KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }} }

      - name: Create namespace (idempotent)
        run: |
          NS="${{ github.event.inputs.namespace }}"
          sed "s/mcp-tasks/${NS}/g" k8s/safe/namespace.yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          NS="${{ github.event.inputs.namespace }}"
          kubectl -n "$NS" apply -f k8s/safe/deploy.yaml
          kubectl -n "$NS" apply -f k8s/safe/service.yaml
          if [ -f k8s/safe/ingress.yaml ]; then kubectl -n "$NS" apply -f k8s/safe/ingress.yaml; fi

      - name: Set image to new SHA
        run: |
          NS="${{ github.event.inputs.namespace }}"
          kubectl -n "$NS" set image deploy/mcp-tasks-deploy server="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Wait for rollout
        run: |
          NS="${{ github.event.inputs.namespace }}"
          kubectl -n "$NS" rollout status deploy/mcp-tasks-deploy --timeout=180s
