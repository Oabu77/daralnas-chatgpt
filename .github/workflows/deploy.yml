################################################################################
# GitHub Actions CI/CD Pipeline for QuranChain-OS
# Automated testing, building, and deployment to production
################################################################################

name: Deploy QuranChain-OS to Production

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - "logs/**"

  pull_request:
    branches: [ main ]

  workflow_dispatch:

env:
  NODE_VERSION: "18"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test job
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint --if-present || true
      
      - name: Run tests
        run: npm test --if-present || true
      
      - name: Run security audit
        run: npm audit --audit-level=moderate || true

  # Build job
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # Deploy job (production only)
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/darcloud_prod
          chmod 600 ~/.ssh/darcloud_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Download smoke tests
        run: |
          mkdir -p deploy-scripts
          cp production-smoke-tests.sh deploy-scripts/
          chmod +x deploy-scripts/production-smoke-tests.sh
      
      - name: Deploy to production
        run: |
          scp -i ~/.ssh/darcloud_prod -r . ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/darcloud/quranchain-mesh/
          ssh -i ~/.ssh/darcloud_prod ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /var/www/darcloud/quranchain-mesh
            npm install --production
            systemctl restart quranchain-app.service || true
            systemctl restart quranchain-blockchain.service || true
          EOF
      
      - name: Run smoke tests on deployed application
        run: |
          ssh -i ~/.ssh/darcloud_prod ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            bash /var/www/darcloud/quranchain-mesh/production-smoke-tests.sh
          EOF
      
      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployment to production successful!'
            })
      
      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Deployment failed. Check logs for details.'
            })

  # Notification job
  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
