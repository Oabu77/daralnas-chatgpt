name: IPFS Command Boundary Security

on:
  pull_request:
    paths:
      - 'revenue-server.js'
      - 'revenue-server-legacy.js'
      - 'revenue-server-secure.js'
      - 'security/ipfs_command_policy.js'
      - 'security/test_ipfs_command_policy.js'
      - 'quick-deploy-live.sh'
      - 'start_all.sh'
      - 'deploy-live-production.sh'
      - 'deploy-servers-local.sh'
      - 'launch_production.sh'
      - 'deploy-to-ec2.sh'
      - 'deploy/aws/quranchain-revenue.service'
      - 'deploy/systemd/quranchain-app.service'
      - '.github/workflows/ipfs-command-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipfs-command-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check security/ipfs_command_policy.js
          node --check revenue-server.js
          node --check revenue-server-secure.js
          node --check revenue-server-legacy.js
          bash -n deploy-servers-local.sh
          bash -n launch_production.sh
          bash -n deploy-to-ec2.sh
      - name: Synthetic command-boundary regression
        run: node security/test_ipfs_command_policy.js
      - name: Verify compatibility entrypoint is guarded
        run: |
          grep -Fq "createExecGuard" revenue-server.js
          grep -Fq "require('./revenue-server-legacy')" revenue-server.js
          if grep -RInE 'node ([^ ]*/)?revenue-server-legacy\.js([[:space:]]|$)' \
            --include='*.sh' --include='*.service' --include='*.yml' --include='*.yaml' .; then
            echo 'A launcher bypasses the guarded compatibility entrypoint' >&2
            exit 1
          fi
      - name: Guard explicitly migrated launch definitions
        run: |
          if grep -nE 'node ([^ ]*/)?revenue-server\.js([[:space:]]|$)' \
            deploy-servers-local.sh \
            deploy/aws/quranchain-revenue.service \
            deploy/systemd/quranchain-app.service; then
            echo 'An explicitly migrated launcher regressed to the compatibility name' >&2
            exit 1
          fi
