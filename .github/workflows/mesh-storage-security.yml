name: Mesh Storage Security

on:
  pull_request:
    paths:
      - 'src/services/meshStorageBackend.js'
      - 'src/services/secureMeshStorageBackend.js'
      - 'src/services/meshStorageSecurity.js'
      - '__tests__/meshStorageSecurity.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/mesh-storage-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check security boundary
        run: |
          node --check src/services/meshStorageSecurity.js
          node --check src/services/secureMeshStorageBackend.js
          node --check __tests__/meshStorageSecurity.test.js

      - name: Run focused synthetic security tests
        run: npm run test:mesh-storage-security
