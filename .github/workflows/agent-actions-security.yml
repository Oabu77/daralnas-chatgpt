name: Agent Actions Security

on:
  pull_request:
    branches: [ main ]
    paths:
      - "agent-actions-server.js"
      - "src/services/webhookDispatcher.js"
      - "src/security/agentWebhookPolicy.js"
      - "__tests__/agent-actions-security.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-actions-security.yml"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check security boundary
        run: |
          node --check agent-actions-server.js
          node --check src/services/webhookDispatcher.js
          node --check src/security/agentWebhookPolicy.js

      - name: Run Agent Actions security regression
        run: npx jest __tests__/agent-actions-security.test.js --runInBand
