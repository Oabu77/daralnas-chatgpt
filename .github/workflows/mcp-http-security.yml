name: MCP HTTP Security

on:
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-http-security.yml"
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-http-security.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 18.x
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile hardened MCP HTTP entrypoint
        run: |
          set +e
          npx tsc --noEmit --strict --target ES2020 --module ES2020 --moduleResolution bundler --esModuleInterop --skipLibCheck src/http-server.ts > tsc-output.txt 2>&1
          status=$?
          cat tsc-output.txt
          exit $status

      - name: Run MCP HTTP security guard
        if: always()
        run: npm run test:security:http

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mcp-http-tsc-diagnostics
          path: mcp/tsc-output.txt
          if-no-files-found: error
          retention-days: 1
