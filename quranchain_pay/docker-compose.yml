version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quranchain-pay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quranchain
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: quranchain_pay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quranchain -d quranchain_pay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # QuranChain Pay API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quranchain-pay-api
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://quranchain:${DB_PASSWORD:-changeme}@postgres:5432/quranchain_pay
      - FOUNDER_ROYALTY_PERCENT=${FOUNDER_ROYALTY_PERCENT:-0.025}
      - FOUNDER_USDC_ADDRESS=${FOUNDER_USDC_ADDRESS}
      - FOUNDER_ETH_ADDRESS=${FOUNDER_ETH_ADDRESS}
      - FOUNDER_BTC_ADDRESS=${FOUNDER_BTC_ADDRESS}
      - ETH_RPC_URL=${ETH_RPC_URL}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - ACH_PROVIDER_API_KEY=${ACH_PROVIDER_API_KEY}
      - ACH_PROVIDER_URL=${ACH_PROVIDER_URL}
      - HOST=0.0.0.0
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: quranchain-pay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - api

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: quranchain-pay-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_data:
