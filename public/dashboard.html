<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveExpress™ Operations Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-bottom: 2px solid #4a90e2;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
        }
        .header .status {
            display: inline-block;
            background: #2ecc71;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4a90e2;
        }
        .metric {
            font-size: 36px;
            font-weight: 700;
            margin: 10px 0;
        }
        .metric-label {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚚 OliveExpress™ Operations Dashboard</h1>
        <span class="status"><span class="live-indicator"></span>LIVE</span>
    </div>
    
    <div class="container">
        <div class="grid">
            <div class="card">
                <div class="metric-label">Active Shipments</div>
                <div class="metric" id="active-shipments">0</div>
            </div>
            <div class="card">
                <div class="metric-label">Delivered Today</div>
                <div class="metric" id="delivered-today">0</div>
            </div>
            <div class="card">
                <div class="metric-label">Revenue (Today)</div>
                <div class="metric" id="revenue-today">$0</div>
            </div>
            <div class="card">
                <div class="metric-label">Carrier Trust Score</div>
                <div class="metric" id="avg-trust-score">85</div>
            </div>
        </div>
    </div>
</body>
</html>
