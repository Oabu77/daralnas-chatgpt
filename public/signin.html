<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DarCloud™ Portal</title>
    <meta name="description" content="Sign in to access all DarCloud™ services">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2a5298;
            --primary-dark: #1e3c72;
            --secondary: #2ecc71;
            --accent: #f39c12;
            --text: #2c3e50;
            --light: #ecf0f1;
            --white: #ffffff;
            --error: #e74c3c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .signin-container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            padding: 3rem;
        }
        
        .logo {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .forgot-password {
            color: var(--primary);
            text-decoration: none;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .btn-signin {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-signin:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
        }
        
        .btn-signin:active {
            transform: translateY(0);
        }
        
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #999;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .demo-signin {
            text-align: center;
            margin-top: 1rem;
        }
        
        .demo-signin button {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .demo-signin button:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        
        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: var(--error);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
        
        .success-message {
            background: #e8f8f5;
            color: var(--secondary);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">🌐</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access all DarCloud™ services</p>
        
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
        
        <form id="signin-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="margin: 0; font-weight: normal;">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-signin">Sign In</button>
        </form>
        
        <div class="divider">OR</div>
        
        <div class="demo-signin">
            <button type="button" id="demo-signin-btn">Demo Access (No Login Required)</button>
        </div>
        
        <div class="signup-link">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Handle form submission
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Hide previous messages
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
            
            // For demo purposes, accept any email/password combination
            // In production, this would call your authentication API
            if (email && password) {
                // Store session
                const session = {
                    email: email,
                    loggedIn: true,
                    timestamp: new Date().toISOString()
                };
                
                if (remember) {
                    localStorage.setItem('darcloud_session', JSON.stringify(session));
                } else {
                    sessionStorage.setItem('darcloud_session', JSON.stringify(session));
                }
                
                // Show success message
                const successMsg = document.getElementById('success-message');
                successMsg.textContent = '✅ Sign in successful! Redirecting to portal...';
                successMsg.style.display = 'block';
                
                // Redirect to portal
                setTimeout(() => {
                    window.location.href = '/portal.html';
                }, 1500);
            } else {
                showError('Please enter both email and password');
            }
        });
        
        // Handle demo access
        document.getElementById('demo-signin-btn').addEventListener('click', () => {
            const session = {
                email: 'demo@darcloud.host',
                loggedIn: true,
                demo: true,
                timestamp: new Date().toISOString()
            };
            
            sessionStorage.setItem('darcloud_session', JSON.stringify(session));
            
            const successMsg = document.getElementById('success-message');
            successMsg.textContent = '✅ Demo access granted! Redirecting to portal...';
            successMsg.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = '/portal.html';
            }, 1000);
        });
        
        function showError(message) {
            const errorMsg = document.getElementById('error-message');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
        }
        
        // Check if already logged in
        const session = localStorage.getItem('darcloud_session') || sessionStorage.getItem('darcloud_session');
        if (session) {
            try {
                const sessionData = JSON.parse(session);
                if (sessionData.loggedIn) {
                    // Already logged in, redirect to portal
                    window.location.href = '/portal.html';
                }
            } catch (e) {
                console.error('Invalid session data');
            }
        }
    </script>
</body>
</html>
