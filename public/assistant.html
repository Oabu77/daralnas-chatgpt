<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f3460">
    <title>DarCloud AI Assistant</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eee;
            --text-secondary: #aaa;
            --accent: #e94560;
            --success: #00d9ff;
            --border: #2d3561;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            padding: 1rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-indicator.offline {
            background: #666;
            animation: none;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--bg-tertiary);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant {
            background: var(--bg-secondary);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
            border-left: 3px solid var(--accent);
        }

        .message.system {
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
            align-self: center;
            max-width: 100%;
        }

        .typing-indicator {
            display: flex;
            gap: 0.3rem;
            padding: 1rem;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-container {
            background: var(--bg-secondary);
            padding: 1rem;
            border-top: 2px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .input-container input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 2rem;
            font-size: 1rem;
            outline: none;
        }

        .input-container input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .quick-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            overflow-x: auto;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .quick-action {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-action:active {
            transform: scale(0.95);
            background: var(--accent);
        }

        .install-prompt {
            position: fixed;
            bottom: 5rem;
            left: 1rem;
            right: 1rem;
            background: var(--accent);
            color: white;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
            display: none;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-prompt.show {
            display: block;
        }

        .install-btn {
            background: white;
            color: var(--accent);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
            width: 100%;
        }

        .network-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <div class="status-indicator" id="statusDot"></div>
            DarCloud AI
        </h1>
        <div class="network-status" id="networkStatus">Connecting...</div>
    </div>

    <div class="quick-actions">
        <button class="quick-action" onclick="quickAction('status')">📊 Status</button>
        <button class="quick-action" onclick="quickAction('shipments')">🚚 Shipments</button>
        <button class="quick-action" onclick="quickAction('help')">❓ Help</button>
        <button class="quick-action" onclick="quickAction('learn')">🧠 Teach Me</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message system">
            🌐 Connected to DarCloud & Fungi Mesh Network<br>
            Your AI assistant is always learning and ready to help!
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Ask me anything..." autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <div class="install-prompt" id="installPrompt">
        <strong>📱 Install DarCloud AI</strong>
        <p>Add to your home screen for always-on access!</p>
        <button class="install-btn" onclick="installApp()">Install Now</button>
    </div>

    <script>
        let deferredPrompt;
        let conversationHistory = [];
        let isOnline = navigator.onLine;

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.error('Service Worker registration failed:', err));
        }

        // Install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    document.getElementById('installPrompt').classList.remove('show');
                    deferredPrompt = null;
                });
            }
        }

        // Network status monitoring
        function updateNetworkStatus() {
            isOnline = navigator.onLine;
            const statusDot = document.getElementById('statusDot');
            const networkStatus = document.getElementById('networkStatus');
            
            if (isOnline) {
                statusDot.classList.remove('offline');
                networkStatus.textContent = 'Online';
                checkServerStatus();
            } else {
                statusDot.classList.add('offline');
                networkStatus.textContent = 'Offline';
            }
        }

        async function checkServerStatus() {
            try {
                const response = await fetch('/fungi/sentinel/health');
                if (response.ok) {
                    document.getElementById('networkStatus').textContent = 'DarCloud Live';
                }
            } catch (err) {
                console.error('Status check failed:', err);
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // Initialize
        updateNetworkStatus();
        setInterval(checkServerStatus, 30000); // Check every 30 seconds

        // Chat functionality
        function addMessage(content, type = 'assistant') {
            const chatContainer = document.getElementById('chatContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = content;
            chatContainer.appendChild(message);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const chatContainer = document.getElementById('chatContainer');
            const typing = document.createElement('div');
            typing.className = 'message assistant typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            typing.id = 'typing';
            chatContainer.appendChild(typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Store in conversation history
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            showTyping();
            
            try {
                // Send to AI endpoint
                const response = await fetch('/chatgpt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: conversationHistory,
                        stream: false
                    })
                });
                
                hideTyping();
                
                if (response.ok) {
                    const data = await response.json();
                    const aiResponse = data.response || data.message || 'I understand. How can I help you further?';
                    
                    addMessage(aiResponse, 'assistant');
                    conversationHistory.push({ role: 'assistant', content: aiResponse });
                    
                    // Trim history to prevent too long context
                    if (conversationHistory.length > 20) {
                        conversationHistory = conversationHistory.slice(-20);
                    }
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'system');
                }
            } catch (error) {
                hideTyping();
                if (isOnline) {
                    addMessage('Connection error. Please check your network.', 'system');
                } else {
                    addMessage('You are offline. I will respond when connection is restored.', 'system');
                }
            }
        }

        async function quickAction(action) {
            switch(action) {
                case 'status':
                    showTyping();
                    try {
                        const response = await fetch('/fungi/sentinel/status');
                        const data = await response.json();
                        hideTyping();
                        addMessage(`🌐 Network Status: ${data.data?.status || 'Unknown'}\n\nAll systems monitored and operational!`, 'assistant');
                    } catch (err) {
                        hideTyping();
                        addMessage('Unable to fetch status. Please try again.', 'system');
                    }
                    break;
                case 'shipments':
                    document.getElementById('messageInput').value = 'Show me recent shipments';
                    sendMessage();
                    break;
                case 'help':
                    addMessage('I can help you with:\n\n📊 Network status\n🚚 Shipment tracking\n📿 QuranChain operations\n🤖 AI-powered dispatch\n📍 Location tracking\n\nJust ask me anything!', 'assistant');
                    break;
                case 'learn':
                    addMessage('Great! I\'m always learning from our conversations. You can:\n\n• Teach me about your preferences\n• Share shipment patterns\n• Provide feedback on my responses\n• Help me understand your workflow\n\nWhat would you like to teach me?', 'assistant');
                    break;
            }
        }

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            setTimeout(() => {
                Notification.requestPermission();
            }, 5000);
        }

        // Periodic background sync (if supported)
        if ('periodicSync' in navigator.serviceWorker) {
            navigator.serviceWorker.ready.then(registration => {
                registration.periodicSync.register('check-status', {
                    minInterval: 5 * 60 * 1000 // 5 minutes
                });
            });
        }
    </script>
</body>
</html>
