# Cloudflare Pages Configuration
# Deploy static sites and dashboards

# Build configuration
[build]
  command = "echo 'Static assets ready'"
  publish = "public"

# Environment variables
[build.environment]
  NODE_VERSION = "20"

# Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Redirects
[[redirects]]
  from = "/api/*"
  to = "https://daralnas-chatgpt.oabu77.workers.dev/:splat"
  status = 200
  force = true

# Custom domain routing
[[redirects]]
  from = "https://darcloud.host/*"
  to = "https://daralnas-chatgpt.oabu77.workers.dev/:splat"
  status = 200
  force = false
