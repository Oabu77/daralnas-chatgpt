apiVersion: apps/v1
kind: Deployment
metadata:
  name: quranchain-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quranchain
  template:
    metadata:
      labels:
        app: quranchain
    spec:
      containers:
      - name: quranchain
        image: quranchain-os:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: quranchain-config
        # Add secret for sensitive data like MONGODB_URI and INFURA_PROJECT_ID
        # envFrom:
        # - secretRef:
        #     name: quranchain-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"